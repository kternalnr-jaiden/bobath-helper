<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트립탄 & 편두통 급성기 치료 임상 참조 — 하남보바스병원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--surface3:#eef2f7;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --accent:#4f46e5;--accent-dim:rgba(79,70,229,.08);--accent-light:rgba(79,70,229,.13);
  --text:#0f172a;--text-muted:#64748b;--text-soft:#475569;
  --danger:#dc2626;--danger-dim:rgba(220,38,38,.08);
  --warn:#d97706;--warn-dim:rgba(217,119,6,.09);
  --ok:#16a34a;--ok-dim:rgba(22,163,74,.09);
  --fast:#4f46e5;--long:#0f766e;--combo:#c2410c;--new:#6d28d9;
  --r:12px;--sh:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.65;min-height:100vh;}

/* ─ HEADER ─ */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px 12px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.home-btn{display:inline-flex;align-items:center;gap:4px;background:var(--surface3);border:1px solid var(--border);color:var(--text-muted);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:8px;text-decoration:none;transition:all .18s;flex-shrink:0;font-family:'Noto Sans KR',sans-serif;}
.home-btn:hover{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.header-brand{flex:1;min-width:0;}
.header-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:900;letter-spacing:-.5px;color:var(--text);line-height:1.2;}
.header-title span{color:var(--accent);}
.header-sub{font-size:10px;color:var(--text-muted);letter-spacing:.4px;text-transform:uppercase;margin-top:2px;}
.drug-count-badge{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;flex-shrink:0;}
.search-wrap{position:relative;margin-bottom:9px;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:13px;}
#searchInput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:8px 11px 8px 32px;outline:none;transition:border-color .18s,box-shadow .18s;}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
#searchInput::placeholder{color:var(--text-muted);}
.class-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;}
.class-tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-family:'Noto Sans KR',sans-serif;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer;transition:all .18s;white-space:nowrap;}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.tab-btn.active[data-class="ALL"]{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
.tab-btn.active[data-class="속효성"]{background:rgba(79,70,229,.12);border-color:var(--fast);color:var(--fast);}
.tab-btn.active[data-class="지속성"]{background:rgba(15,118,110,.1);border-color:var(--long);color:var(--long);}
.tab-btn.active[data-class="복합제"]{background:rgba(194,65,12,.09);border-color:var(--combo);color:var(--combo);}
.tab-btn.active[data-class="신규기전"]{background:rgba(109,40,217,.1);border-color:var(--new);color:var(--new);}
.tab-btn.active[data-class="비교표"]{background:rgba(15,118,110,.1);border-color:var(--long);color:var(--long);}
.tab-btn[data-class="비교표"]{border-color:rgba(15,118,110,.35);color:var(--long);}

/* ─ MAIN ─ */
main{padding:13px 15px 28px;max-width:960px;margin:0 auto;}

/* ─ DRUG CARD ─ */
.drug-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:var(--sh);transition:box-shadow .2s,border-color .2s;}
.drug-card:hover,.drug-card.open{box-shadow:var(--sh2);border-color:var(--border-strong);}
.drug-card[data-class="속효성"] .bar{background:var(--fast);}
.drug-card[data-class="지속성"] .bar{background:var(--long);}
.drug-card[data-class="복합제"] .bar{background:var(--combo);}
.drug-card[data-class="신규기전"] .bar{background:var(--new);}
.bar{height:3px;}
.card-header{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px;user-select:none;}
.cls-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;flex-shrink:0;}
.badge-속효성{background:rgba(79,70,229,.12);color:var(--fast);}
.badge-지속성{background:rgba(15,118,110,.1);color:var(--long);}
.badge-복합제{background:rgba(194,65,12,.1);color:var(--combo);}
.badge-신규기전{background:rgba(109,40,217,.1);color:var(--new);}
.card-names{flex:1;min-width:0;}
.kor{font-size:14px;font-weight:700;color:var(--text);}
.eng{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.meta-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;}
.brand{font-size:10.5px;color:var(--text-muted);}

/* code pills */
.hcp{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(79,70,229,.1);color:var(--accent);border:1px solid rgba(79,70,229,.27);cursor:pointer;transition:all .15s;user-select:none;display:inline-flex;align-items:center;gap:2px;}
.hcp::after{content:'⎘';font-size:9px;opacity:.45;}
.hcp:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px);box-shadow:0 2px 5px rgba(79,70,229,.3);}
.hcp:hover::after{opacity:1;}
.hcp.hcp-nocode{opacity:.55;background:var(--surface3);color:var(--text-muted);border-color:var(--border);cursor:default;}
.hcp.hcp-nocode::after{content:'?';}
.hcp.hcp-nocode:hover{background:var(--surface3);color:var(--text-muted);border-color:var(--border);transform:none;box-shadow:none;}
.hcp.hcp-combo{background:rgba(194,65,12,.1);color:var(--combo);border-color:rgba(194,65,12,.27);}
.hcp.hcp-combo:hover{background:var(--combo);color:#fff;border-color:var(--combo);}
.hcp.flash{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;}
.hcp.flash::after{content:'✓'!important;opacity:1;}

.card-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.onset-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.onset-fast{background:var(--ok-dim);color:var(--ok);border:1px solid rgba(22,163,74,.25);}
.onset-mid{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(217,119,6,.25);}
.onset-slow{background:rgba(100,116,139,.1);color:var(--text-muted);border:1px solid rgba(100,116,139,.2);}
.chev{color:var(--text-muted);font-size:11px;transition:transform .22s;flex-shrink:0;}
.drug-card.open .chev{transform:rotate(90deg);}

/* kinetics row */
.kinetics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 12px;}
@media(max-width:540px){.kinetics-row{grid-template-columns:repeat(2,1fr);}}
.kbox{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.klbl{font-size:9px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
.kval{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--accent);}
.kval.amber{color:var(--warn);}

/* card body */
.card-body{display:none;border-top:1px solid var(--border);}
.drug-card.open .card-body{display:block;}

/* inner tabs */
.itabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;background:var(--surface2);}
.itabs::-webkit-scrollbar{display:none;}
.itab{flex-shrink:0;padding:8px 13px;font-size:11.5px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .18s;white-space:nowrap;font-weight:500;}
.itab:hover{color:var(--text-soft);}
.itab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;background:var(--surface);}
.ipanel{display:none;padding:14px;}
.ipanel.active{display:block;}

/* pros/cons */
.pc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;}
@media(max-width:500px){.pc{grid-template-columns:1fr;}}
.pros,.cons{background:var(--surface2);border-radius:9px;padding:11px;}
.pros{border-left:3px solid var(--ok);}
.cons{border-left:3px solid var(--danger);}
.btitle{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.pros .btitle{color:var(--ok);}
.cons .btitle{color:var(--danger);}
.blist{list-style:none;}
.blist li{font-size:12px;color:var(--text-soft);padding:2px 0 2px 13px;position:relative;}
.blist li::before{content:'▸';position:absolute;left:0;font-size:9.5px;}
.pros .blist li::before{color:var(--ok);}
.cons .blist li::before{color:var(--danger);}

/* formulary */
.fsec{margin-top:11px;}
.ftitle{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);font-weight:700;margin-bottom:6px;}
.fgrid{display:flex;flex-wrap:wrap;gap:5px;}
.fpill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .15s;}
.fpill:hover{border-color:var(--accent);background:var(--accent-dim);}
.fpill.flash-pill{border-color:var(--ok)!important;background:var(--ok-dim)!important;}
.fcode{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);}
.fname{font-size:11.5px;color:var(--text-soft);}
.ftag{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;}
.ftag-outer{background:rgba(79,70,229,.1);color:var(--accent);}
.ftag-nocode{background:var(--surface3);color:var(--text-muted);border:1px solid var(--border);}
.no-f{font-size:11.5px;color:var(--text-muted);background:var(--surface2);border-radius:8px;padding:7px 11px;border-left:3px solid var(--border);}

/* dose */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
@media(max-width:500px){.igrid{grid-template-columns:1fr;}}
.ibox{background:var(--surface2);border-radius:9px;padding:11px;}
.ilabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);font-weight:700;margin-bottom:3px;}
.ival{font-size:12.5px;color:var(--text);}
.doseval{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);font-weight:700;}
.dose3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
@media(max-width:500px){.dose3{grid-template-columns:1fr 1fr;}}

/* interaction calc */
.calc-wrap{background:var(--accent-dim);border:1px solid rgba(79,70,229,.2);border-radius:10px;padding:12px;margin-top:4px;}
.calc-title{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.check-row{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 11px;cursor:pointer;font-size:12px;color:var(--text-soft);}
.check-row input{accent-color:var(--accent);}
.dose-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.dout{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px;}
.dout-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);font-weight:700;margin-bottom:3px;}
.dout-val{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:900;color:var(--accent);}
.dout-val.red{color:var(--danger);}
.calc-note{font-size:11px;color:var(--text-muted);margin-top:7px;}
.calc-note.warn{color:var(--danger);font-weight:600;}

/* interactions */
.ilist{display:flex;flex-direction:column;gap:6px;}
.iitem{background:var(--surface2);border-radius:9px;padding:10px;display:flex;gap:8px;align-items:flex-start;}
.isev{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0;min-width:44px;text-align:center;margin-top:1px;}
.sev-ci{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(220,38,38,.28);}
.sev-high{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(217,119,6,.28);}
.sev-mod{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(79,70,229,.22);}
.ibody .idrug{font-size:12px;font-weight:700;color:var(--text);margin-bottom:1px;}
.ibody .imech{font-size:11px;color:var(--text-muted);}

/* CI */
.stitle{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);font-weight:700;margin:13px 0 6px;}
.stitle:first-child{margin-top:0;}
.cilist{display:flex;flex-direction:column;gap:5px;}
.ciitem{background:var(--surface2);border-radius:7px;padding:8px 12px;display:flex;gap:8px;align-items:center;}
.ciicon{color:var(--danger);font-size:12px;flex-shrink:0;}
.citext{font-size:12px;color:var(--text-soft);}
.monlist{display:flex;flex-wrap:wrap;gap:5px;}
.monpill{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--text-soft);}
.notebox{background:rgba(79,70,229,.05);border:1px solid rgba(79,70,229,.17);border-radius:9px;padding:11px;margin-top:11px;}
.notebox .nl{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);font-weight:700;margin-bottom:3px;}
.notebox p{font-size:12px;color:var(--text-soft);}
.warnbox{background:rgba(220,38,38,.05);border:1px solid rgba(220,38,38,.18);border-radius:9px;padding:11px;margin-top:9px;}
.warnbox .nl{font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--danger);font-weight:700;margin-bottom:3px;}
.warnbox p{font-size:12px;color:var(--text-soft);}

/* ─ COMPARISON TABLE VIEW ─ */
#tableView{display:none;padding:13px 15px 32px;max-width:960px;margin:0 auto;}
#tableView.visible{display:block;}
.tbl-header{background:linear-gradient(135deg,#312e81 0%,#4f46e5 100%);border-radius:var(--r);padding:16px 20px;margin-bottom:12px;color:#fff;}
.tbl-header h2{font-family:'Outfit',sans-serif;font-size:17px;font-weight:900;margin-bottom:2px;}
.tbl-header p{font-size:11.5px;opacity:.8;}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);}
table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);}
thead tr{background:var(--surface2);border-bottom:2px solid var(--border);}
th{padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);font-weight:700;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:hover{background:var(--surface2);}
td{padding:9px 12px;vertical-align:middle;}
.td-drug{font-weight:700;color:var(--text);font-size:12.5px;}
.td-eng{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.td-cls{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:4px;}
.cls-f{background:rgba(79,70,229,.12);color:var(--fast);}
.cls-l{background:rgba(15,118,110,.1);color:var(--long);}
.cls-c{background:rgba(194,65,12,.1);color:var(--combo);}
.cls-n{background:rgba(109,40,217,.1);color:var(--new);}
.td-code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent);cursor:pointer;padding:2px 6px;border-radius:4px;background:var(--accent-dim);border:1px solid rgba(79,70,229,.2);transition:all .15s;}
.td-code:hover{background:var(--accent);color:#fff;}
.td-code.nocode{color:var(--text-muted);background:var(--surface3);border-color:var(--border);cursor:default;}
.td-code.nocode:hover{background:var(--surface3);color:var(--text-muted);}
.td-hl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--accent);}
.td-warn{font-size:10.5px;color:var(--warn);}
.td-ok{font-size:10.5px;color:var(--ok);}
.td-note{font-size:10.5px;color:var(--text-muted);max-width:180px;}

/* legend */
.legend{display:flex;gap:9px;flex-wrap:wrap;padding:8px 15px;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;box-shadow:0 -1px 4px rgba(0,0,0,.04);}
.li{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--text-muted);}
.ld{width:7px;height:7px;border-radius:50%;}

/* toast */
#toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;color:#fff;font-size:12px;font-weight:600;padding:7px 15px;border-radius:20px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
.empty .big{font-size:38px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <div class="header-top">
    <a href="index.html" class="home-btn">🏠 홈</a>
    <div class="header-brand">
      <div class="header-title">트립탄 & 편두통 <span>임상참조</span></div>
      <div class="header-sub">Triptan & Acute Migraine Clinical Reference · 하남보바스병원 약제팀</div>
    </div>
    <div class="drug-count-badge" id="cntBadge">10 drugs</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="약품명·성분명·원외코드 검색… (예: rizatriptan, IMIG, 수마트립탄)">
  </div>
  <div class="class-tabs">
    <button class="tab-btn active" data-class="ALL">전체</button>
    <button class="tab-btn" data-class="속효성">속효성 트립탄</button>
    <button class="tab-btn" data-class="지속성">지속성 트립탄</button>
    <button class="tab-btn" data-class="복합제">복합제</button>
    <button class="tab-btn" data-class="신규기전">신규 기전</button>
    <button class="tab-btn" data-class="비교표">📊 마스터 비교표</button>
  </div>
</header>

<main id="drugList"></main>
<div id="tableView"></div>

<div class="legend">
  <div class="li"><div class="ld" style="background:var(--fast)"></div>속효성 트립탄</div>
  <div class="li"><div class="ld" style="background:var(--long)"></div>지속성 트립탄</div>
  <div class="li"><div class="ld" style="background:var(--combo)"></div>복합제</div>
  <div class="li"><div class="ld" style="background:var(--new)"></div>신규 기전</div>
  <div class="li"><div class="ld" style="background:var(--accent)"></div>원외코드 클릭=복사</div>

// ─── TABLE DATA ───
function buildTable() {
  const tv = document.getElementById('tableView');
  const rows = drugs.map(d=>{
    const codeCell = d.formulary[0].nocode
      ? `<span class="td-code nocode">${d.formulary[0].code}</span>`
      : `<span class="td-code" onclick="cc('${d.formulary[0].code}',this)">${d.formulary[0].code}</span>`;
    const clsCls = {속효성:'cls-f',지속성:'cls-l',복합제:'cls-c',신규기전:'cls-n'}[d.drugClass];
    return `<tr>
      <td><div class="td-drug">${d.nameKor}</div><div class="td-eng">${d.nameEng}</div><div style="font-size:10px;color:var(--text-muted);margin-top:2px">${d.brand}</div></td>
      <td><span class="td-cls ${clsCls}">${d.drugClass}</span></td>
      <td>${codeCell}</td>
      <td class="td-hl">${d.halfLife}</td>
      <td>${d.onset}</td>
      <td class="td-hl">${d.initDose}</td>
      <td class="td-hl">${d.maxDose}</td>
      <td class="td-hl">${d.bio}</td>
      <td><span class="${d.recurrence.includes('낮')||d.recurrence.includes('최저')?'td-ok':d.recurrence.includes('높')?'td-warn':''}">${d.recurrence}</span></td>
    </tr>`;
  }).join('');
  tv.innerHTML = `
    <div class="tbl-header">
      <h2>📊 트립탄 & 편두통 급성기 치료제 마스터 비교표</h2>
      <p>전체 ${drugs.length}종 한눈 비교 · 원외코드 클릭 시 복사</p>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>성분명 / 상품명</th><th>분류</th><th>원외코드</th>
          <th>반감기</th><th>효과 발현</th><th>초회량</th><th>일최대량</th>
          <th>생체이용률</th><th>재발률</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="notebox" style="margin-top:12px;">
      <div class="nl">⚠️ 트립탄 공통 금기 (전 성분 동일 적용)</div>
      <p>허혈성 심질환(협심증·심근경색), 변이형 협심증, 뇌졸중·TIA 병력, 조절되지 않는 고혈압, 말초혈관 질환 · MAO 억제제 병용 및 14일 이내 · 에르고타민 함유 제제 24시간 이내 · 타 트립탄 24시간 이내 병용 절대 금기. ※ 라스미디탄(dittan)·리메게판트(gepant)는 트립탄 금기 심혈관 환자에 사용 가능하나 MAOIs 금기 공통 적용.</p>
    </div>`;
}

let curFilter='ALL', searchTerm='';

function renderDrug(d) {
  const hasWidget = d.interactionWidget && d.interactionWidget.show;
  const widgetId = `wgt-${d.id}`;
  const singleId = `si-${d.id}`;
  const maxId = `mx-${d.id}`;
  const noteId = `nt-${d.id}`;

  const fblock = d.formulary.length
    ? `<div class="fsec">
        <div class="ftitle">🏥 원외처방 코드</div>
        <div class="fgrid">${d.formulary.map(f=>
          f.nocode
            ? `<div class="fpill"><span class="fcode" style="color:var(--text-muted)">${f.code}</span><span class="fname">${f.name}</span><span class="ftag ${f.tagCls}">${f.tag}</span></div>`
            : `<div class="fpill" onclick="cc('${f.code}',this)"><span class="fcode">${f.code}</span><span class="fname">${f.name}</span><span class="ftag ${f.tagCls}">${f.tag}</span></div>`
        ).join('')}</div>
      </div>`
    : `<div class="fsec"><div class="ftitle">🏥 원외처방 코드</div><div class="no-f">코드 미확인 — 원무팀 확인 요망</div></div>`;

  const widgetHtml = hasWidget ? `
    <div class="calc-wrap" id="${widgetId}">
      <div class="calc-title">💡 상호작용 실시간 용량 계산기</div>
      <label class="check-row">
        <input type="checkbox" onchange="toggleWidget('${d.id}')">
        <span>${d.interactionWidget.label}</span>
      </label>
      <div class="dose-out">
        <div class="dout"><div class="dout-lbl">1회 초회량</div><div class="dout-val" id="${singleId}">${d.initDose}</div></div>
        <div class="dout"><div class="dout-lbl">24h 최대</div><div class="dout-val" id="${maxId}">${d.maxDose}</div></div>
      </div>
      <div class="calc-note" id="${noteId}">※ 일반 성인 기준. 추가 복용 시 최소 ${d.interval} 간격 준수.</div>
    </div>` : '';

  const pills = d.formulary.map(f=>
    f.nocode
      ? `<span class="hcp hcp-nocode" title="${f.name}">${f.code}</span>`
      : `<span class="hcp" onclick="cc('${f.code}',this,event)" title="${f.name} — 클릭하여 복사">${f.code}</span>`
  ).join('');

  return `<div class="drug-card" data-class="${d.drugClass}" id="card-${d.id}">
  <div class="bar"></div>
  <div class="card-header" onclick="tog('${d.id}')">
    <span class="cls-badge badge-${d.drugClass}">${d.drugClass}</span>
    <div class="card-names">
      <div class="kor">${d.nameKor}</div>
      <div class="eng">${d.nameEng}</div>
      <div class="meta-row"><span class="brand">${d.brand}</span>${pills}</div>
    </div>
    <div class="card-right">
      <span class="onset-badge ${d.onsetTag}">${d.onsetLabel}</span>
      <span class="chev">▶</span>
    </div>
  </div>
  <div class="kinetics-row">
    <div class="kbox"><div class="klbl">반감기</div><div class="kval">${d.halfLife}</div></div>
    <div class="kbox"><div class="klbl">생체이용률</div><div class="kval">${d.bio.split(' ')[0]}</div></div>
    <div class="kbox"><div class="klbl">초회량</div><div class="kval">${d.initDose}</div></div>
    <div class="kbox"><div class="klbl">24h 최대</div><div class="kval amber">${d.maxDose}</div></div>
  </div>
  <div class="card-body" id="body-${d.id}">
    <div class="itabs" id="tabs-${d.id}">
      <div class="itab active" onclick="st('${d.id}','ov',this)">개요</div>
      <div class="itab" onclick="st('${d.id}','dos',this)">용량</div>
      <div class="itab" onclick="st('${d.id}','int',this)">상호작용</div>
      <div class="itab" onclick="st('${d.id}','ci',this)">금기 / 모니터링</div>
    </div>
    <div class="ipanel active" id="p-${d.id}-ov">
      <div class="pc">
        <div class="pros"><div class="btitle">✓ 장점 / 유리한 케이스</div><ul class="blist">${d.pros.map(p=>`<li>${p}</li>`).join('')}</ul></div>
        <div class="cons"><div class="btitle">✗ 주의 / 단점</div><ul class="blist">${d.cons.map(c=>`<li>${c}</li>`).join('')}</ul></div>
      </div>
      ${fblock}
      ${d.note?`<div class="notebox"><div class="nl">📌 임상 참고</div><p>${d.note}</p></div>`:''}
    </div>
    <div class="ipanel" id="p-${d.id}-dos">
      <div class="dose3">
        <div class="ibox"><div class="ilabel">1회 초회량</div><div class="doseval">${d.initDose}</div></div>
        <div class="ibox"><div class="ilabel">재투여 간격</div><div class="doseval">${d.interval}</div></div>
        <div class="ibox"><div class="ilabel">24h 최대량</div><div class="doseval">${d.maxDose}</div></div>
      </div>
      <div class="igrid" style="margin-top:2px;">
        <div class="ibox"><div class="ilabel">효과 발현</div><div class="ival">${d.onset}</div></div>
        <div class="ibox"><div class="ilabel">반감기</div><div class="ival">${d.halfLife}</div></div>
      </div>
      ${widgetHtml}
      ${!hasWidget?`<div class="notebox" style="margin-top:4px;"><div class="nl">복용 원칙</div><p>두통 발생 시 최대한 초기에 복용. 효과 불충분 시 ${d.interval} 후 재복용 가능. 월 10회 이상 복용 시 약물과용두통(MOH) 위험 증가.</p></div>`:''}
    </div>
    <div class="ipanel" id="p-${d.id}-int">
      <div class="ilist">${d.interactions.map(it=>`<div class="iitem">
        <span class="isev ${it.cls}">${it.sev==='ci'?'금기':it.sev==='high'?'심각':'주의'}</span>
        <div class="ibody"><div class="idrug">${it.drugs}</div><div class="imech">${it.mech}</div></div>
      </div>`).join('')}</div>
    </div>
    <div class="ipanel" id="p-${d.id}-ci">
      <div class="stitle">🚫 금기 (Contraindications)</div>
      <div class="cilist">${d.contraindications.map(c=>`<div class="ciitem"><span class="ciicon">✕</span><span class="citext">${c}</span></div>`).join('')}</div>
      <div class="stitle">🔬 모니터링 항목</div>
      <div class="monlist">${d.monitoring.map(m=>`<span class="monpill">${m}</span>`).join('')}</div>
      <div class="warnbox" style="margin-top:11px;"><div class="nl">⚠️ 트립탄 공통 금기 (심혈관)</div>
        <p>허혈성 심질환, 변이형 협심증, 뇌졸중/TIA 병력, 조절 불량 고혈압, 말초혈관 질환 → 전 트립탄 공통 절대 금기. ※ 라스미디탄·리메게판트는 예외.</p>
      </div>
    </div>
  </div>
</div>`;
}

// ─── INTERACTIONS ───
function tog(id){document.getElementById('card-'+id).classList.toggle('open');}
function st(did,tab,el){
  document.querySelectorAll(`#tabs-${did} .itab`).forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll(`[id^="p-${did}-"]`).forEach(p=>p.classList.remove('active'));
  document.getElementById(`p-${did}-${tab}`).classList.add('active');
}
function toggleWidget(id){
  const d=drugs.find(x=>x.id===id);
  if(!d||!d.interactionWidget)return;
  const cb=document.querySelector(`#card-${id} .check-row input`);
  const si=document.getElementById(`si-${id}`);
  const mx=document.getElementById(`mx-${id}`);
  const nt=document.getElementById(`nt-${id}`);
  if(cb.checked){
    si.textContent=d.interactionWidget.altInit;si.className='dout-val red';
    mx.textContent=d.interactionWidget.altMax;mx.className='dout-val red';
    nt.innerHTML=`⚠️ <strong>경고:</strong> ${d.interactionWidget.alertText}`;nt.className='calc-note warn';
  }else{
    si.textContent=d.initDose;si.className='dout-val';
    mx.textContent=d.maxDose;mx.className='dout-val';
    nt.textContent=`※ 일반 성인 기준. 추가 복용 시 최소 ${d.interval} 간격 준수.`;nt.className='calc-note';
  }
}
function cc(code,el,ev){
  if(ev)ev.stopPropagation();
  const done=()=>{
    el.classList.add('flash','flash-pill');
    toast(`📋 "${code}" 복사됨`);
    setTimeout(()=>el.classList.remove('flash','flash-pill'),1100);
  };
  navigator.clipboard?navigator.clipboard.writeText(code).then(done).catch(()=>{fb(code);done()}):(fb(code),done());
}
function fb(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}

function render(){
  const isTable=curFilter==='비교표';
  const dl=document.getElementById('drugList');
  const tv=document.getElementById('tableView');
  dl.style.display=isTable?'none':'';
  tv.classList.toggle('visible',isTable);
  if(isTable){document.getElementById('cntBadge').textContent='비교표';return;}
  let list=drugs.filter(d=>{
    const mc=curFilter==='ALL'||d.drugClass===curFilter;
    const q=searchTerm.toLowerCase();
    const ms=!q||d.nameKor.includes(q)||d.nameEng.toLowerCase().includes(q)||d.brand.toLowerCase().includes(q)
      ||d.formulary.some(f=>f.code.toLowerCase().includes(q)||f.name.includes(q));
    return mc&&ms;
  });
  document.getElementById('cntBadge').textContent=list.length+' drugs';
  dl.innerHTML=list.length?list.map(renderDrug).join(''):
    `<div class="empty"><div class="big">🔍</div><p>검색 결과 없음: "${searchTerm}"</p></div>`;
}

document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curFilter=b.dataset.class;render();
}));
document.getElementById('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;render();});

buildTable();
render();
</script>
</body>
</html>
